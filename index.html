<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wimifarma Cotação - Cotador Inteligente ST</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0b0f19;
        color: #f8fafc;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      .wf-splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 45%, #1e293b 0%, #0b0f19 70%);
        user-select: none;
        box-sizing: border-box;
        padding: 24px;
        text-align: center;
      }
      .wf-splash-badge {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        margin-bottom: 28px;
        background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
        border-radius: 22px;
        box-shadow: 0 0 45px rgba(6, 182, 212, 0.4);
        animation: wf-pulse-glow 2s infinite ease-in-out;
      }
      .wf-splash-badge-text {
        font-size: 34px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -1px;
      }
      .wf-splash-title {
        font-size: 24px;
        font-weight: 800;
        color: #f8fafc;
        margin: 0 0 8px 0;
        letter-spacing: -0.5px;
      }
      .wf-splash-subtitle {
        font-size: 14px;
        color: #94a3b8;
        margin: 0 0 32px 0;
        font-weight: 400;
      }
      .wf-splash-progress-track {
        width: 240px;
        height: 5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      .wf-splash-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #0284c7, #06b6d4, #38bdf8);
        border-radius: 6px;
        animation: wf-loading-bar 1.6s infinite ease-in-out;
      }
      .wf-splash-status {
        margin-top: 16px;
        font-size: 12px;
        color: #64748b;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      @keyframes wf-pulse-glow {
        0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(6, 182, 212, 0.35); }
        50% { transform: scale(1.06); box-shadow: 0 0 60px rgba(6, 182, 212, 0.65); }
      }
      @keyframes wf-loading-bar {
        0% { left: -45%; width: 45%; }
        50% { width: 65%; }
        100% { left: 100%; width: 45%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="wf-splash-container">
        <div class="wf-splash-badge">
          <span class="wf-splash-badge-text">WF</span>
        </div>
        <h1 class="wf-splash-title">Wimifarma Cotação</h1>
        <div class="wf-splash-subtitle">Cotador Inteligente ST • Inicializando sistema...</div>
        <div class="wf-splash-progress-track">
          <div class="wf-splash-progress-bar"></div>
        </div>
        <div class="wf-splash-status">Carregando módulos e banco de dados...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
