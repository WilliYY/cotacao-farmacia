name: Validar cotador

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproduziveis
        run: npm ci --no-audit --no-fund

      - name: Validar JavaScript e regras do sistema
        run: npm test

      - name: Executar lint
        run: npm run lint

      - name: Compilar interface
        run: npm run build

      - name: Validar scripts PowerShell
        shell: powershell
        run: |
          $files = @(
            'scripts/create-icon.ps1',
            'scripts/launch-hidden.ps1',
            'scripts/update-shortcut.ps1',
            'src/lib/santacruz-search.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object { $_.Message }
              throw "$file possui erro de sintaxe: $($messages -join '; ')"
            }
          }
